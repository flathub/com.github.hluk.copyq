app-id: com.github.hluk.copyq
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: copyq

finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=gpg-agent
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio

cleanup:
  - /include
  - /lib/cmake
  - /mkspecs
  - /share/bash-completion
  - /share/man

modules:
  - name: qca-qt6
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_PLUGINS=ossl
    sources:
      - type: git
        url: https://invent.kde.org/libraries/qca.git
        tag: v2.3.12
        commit: c7de7c95043b7af1846cd55058474cff4508bb6c
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  - name: qt6keychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$
  - name: miniaudio
    buildsystem: simple
    build-commands:
      - install -Dm644 miniaudio.h ${FLATPAK_DEST}/include/miniaudio.h
    sources:
      - type: git
        url: https://github.com/mackron/miniaudio.git
        tag: 0.11.25
        commit: 9634bedb5b5a2ca38c1ee7108a9358a4e233f14d
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+\.\d+)$

  - name: copyq
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DICON_NAME=com.github.hluk.copyq
      # The flatpak app should not handle autostart itself:
      # https://github.com/flathub/flatpak-builder-lint/issues/87
      - -DCOPYQ_AUTOSTART=OFF
      - -DCOPYQ_AUTOSTART_COMMAND=flatpak run com.github.hluk.copyq
      - -DWITH_QCA_ENCRYPTION=ON
      - -DWITH_KEYCHAIN=ON
      - -DWITH_QT6=1
      - -DMINIAUDIO_INCLUDE_DIR=/app/include
    sources:
      - type: git
        url: https://github.com/hluk/CopyQ.git
        tag: v16.0.0
        commit: ae65a1a2980d9b36848ef29ea17219adfd235aba
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$
